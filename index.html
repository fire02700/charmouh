<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHARMOUH | Streetwear</title>
  <style>
    /* CHARMOUH - Streetwear Landing Page */

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Poppins", sans-serif;
      background-color: #0a0a0a;
      color: #f1f1f1;
      line-height: 1.6;
      overflow-x: hidden;
    }

    header {
      height: 100vh;
      background: linear-gradient(to bottom, rgba(0,0,0,0.7), rgba(0,0,0,0.95)),
                  url('334884.jpg') center/cover no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 0 20px;
    }

    header h1 {
      font-size: 3rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: 2px;
      margin-bottom: 15px;
    }

    header p {
      font-size: 1.2rem;
      color: #cfcfcf;
      max-width: 600px;
      margin-bottom: 40px;
    }

    .btn {
      display: inline-block;
      background: #ff3b3b;
      color: #fff;
      padding: 14px 28px;
      border-radius: 8px;
      font-weight: 700;
      text-decoration: none;
      transition: 0.3s;
    }

    .btn:hover {
      background: #ff1a1a;
      transform: translateY(-3px);
    }

    nav {
      position: absolute;
      top: 20px;
      right: 30px;
      display: flex;
      gap: 25px;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      letter-spacing: 1px;
      transition: color 0.3s;
    }

    nav a:hover {
      color: #ff3b3b;
    }

    footer {
      text-align: center;
      padding: 25px;
      background: #0b0b0b;
      border-top: 1px solid #111;
      color: #888;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html">Home</a>
    <a href="shop.html">Shop</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>

  <header>
    <h1>CHARMOUH</h1>
    <p>Dark. Bold. Streetwear made for those who move different.</p>
    <a href="shop.html" class="btn">Enter the Store</a>
  </header>

  <footer>
    &copy; 2025 CHARMOUH. All rights reserved.
  </footer>

</body>
</html>
