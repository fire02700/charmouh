<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHARMOUH | Contact</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Poppins", sans-serif;
      background-color: #0a0a0a;
      color: #f5f5f5;
      line-height: 1.7;
      overflow-x: hidden;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 30px;
      padding: 20px 0;
      background: #0b0b0b;
      border-bottom: 1px solid #111;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      letter-spacing: 1px;
      transition: color 0.3s;
    }

    nav a:hover {
      color: #ff3b3b;
    }

    header {
      text-align: center;
      padding: 60px 20px;
      background: url('citydark.jpg') center/cover no-repeat;
      position: relative;
    }

    header::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
    }

    header h1 {
      position: relative;
      color: #fff;
      font-size: 3rem;
      font-weight: 800;
      z-index: 2;
    }

    .contact-container {
      width: 900px;
      max-width: 90%;
      margin: 60px auto;
      text-align: center;
    }

    .contact-container h2 {
      color: #ff3b3b;
      margin-bottom: 10px;
      font-size: 1.5rem;
      letter-spacing: 1px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-top: 30px;
    }

    input, textarea {
      padding: 14px;
      background: #111;
      border: 1px solid #1f1f1f;
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
    }

    textarea {
      height: 140px;
      resize: none;
    }

    button {
      background-color: #ff3b3b;
      border: none;
      color: #fff;
      padding: 14px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #ff1a1a;
    }

    .info {
      margin-top: 50px;
      font-size: 1rem;
      color: #bbb;
    }

    footer {
      text-align: center;
      padding: 25px;
      background: #0b0b0b;
      border-top: 1px solid #111;
      color: #888;
      font-size: 14px;
      margin-top: 80px;
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html">Home</a>
    <a href="shop.html">Shop</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>

  <header>
    <h1>CONTACT US</h1>
  </header>

  <section class="contact-container">
    <h2>GET IN TOUCH</h2>
    <p>Have a question or want to collaborate? Drop us a message below.</p>

    <form>
      <input type="text" placeholder="Your Name" required>
      <input type="email" placeholder="Your Email" required>
      <textarea placeholder="Your Message" required></textarea>
      <button type="submit">Send Message</button>
    </form>

    <div class="info">
      <p>Email: <strong>fire02700@gmail.com</strong></p>
      <p>Instagram: <strong>@charmouh.street</strong></p>
    </div>
  </section>

  <footer>
    &copy; 2025 CHARMOUH. All rights reserved.
  </footer>

</body>
</html>
